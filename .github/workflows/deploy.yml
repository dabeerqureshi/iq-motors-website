name: Build & Deploy

# Production-grade CI/CD for IQ Motors.
#  - Pull requests to main: lint + type-check (gatekeeper)
#  - Push to main:          build + deploy to Hostinger via SFTP
#
# Secrets required (repo Settings -> Secrets and variables -> Actions):
#   - SUPABASE_URL, SUPABASE_ANON_KEY          (build-time Vite env)
#   - EMAILJS_SERVICE_ID, EMAILJS_PUBLIC_KEY, EMAILJS_TEMPLATE_ID
#   - HOSTINGER_SFTP_HOST, HOSTINGER_SFTP_USER, HOSTINGER_SFTP_PASSWORD
#   - (optional) HOSTINGER_SFTP_PORT (default 22), HOSTINGER_REMOTE_BASE (default /public_html)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  validate:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Type-check
        run: npx tsc -b --noEmit
      - name: Lint
        run: npx eslint src --max-warnings=50

  build:
    name: Build static site
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SERVICE_ID_EMAILJS: ${{ secrets.EMAILJS_SERVICE_ID }}
          VITE_PUBLIC_KEY_EMAILJS: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          VITE_TEMPLATE_ID_EMAILJS: ${{ secrets.EMAILJS_TEMPLATE_ID }}
        run: npm run build
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::dist/ was not generated by the build"
            exit 1
          fi
          echo "dist/ size:"; du -sh dist
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iq-motors-build
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to Hostinger
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://iq-motors.co.uk
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: iq-motors-build
          path: dist
          ignore-not-found: false

      - name: Deploy to Hostinger via SFTP
        uses: appleboy/sftp-action@v1.7.2
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          port: ${{ secrets.HOSTINGER_SFTP_PORT || '22' }}
          username: ${{ secrets.HOSTINGER_SFTP_USER }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          source: dist/
          target: ${{ secrets.HOSTINGER_REMOTE_BASE || '/public_html' }}
          rm: true
          strip_components: 0
          overwrite: true
          verbose: true
          retry: 3
          retry-interval: "30s"
        env:
          DEPLOY_COMMIT: ${{ github.sha }}

      - name: Report
        if: always()
        run: |
          echo "::notice title=Deploy complete::Build ${{ github.sha }} deployed to https://iq-motors.co.uk"
          echo "Commit: ${{ github.sha }}"
