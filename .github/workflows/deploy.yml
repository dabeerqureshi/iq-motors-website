name: Build & Deploy

# Simple pipeline: on every push to main, build the Vite site and upload
# dist/ to Hostinger via SFTP. No linting and no tests run here.
# Run those locally with: npm run lint, npm run test:run, npm run test:e2e
#
# Secrets required (repo Settings -> Secrets and variables -> Actions):
#   - SUPABASE_URL, SUPABASE_ANON_KEY          (baked into the build)
#   - EMAILJS_SERVICE_ID, EMAILJS_PUBLIC_KEY, EMAILJS_TEMPLATE_ID
#   - HOSTINGER_SFTP_HOST, HOSTINGER_SFTP_USER, HOSTINGER_SFTP_PASSWORD
#   - (optional) HOSTINGER_SFTP_PORT (default 22)
#   - (optional) HOSTINGER_REMOTE_BASE (default /public_html)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys run at the same time (a newer push wins).
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Build & deploy to Hostinger
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://iq-motors.co.uk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets are present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SFTP_HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
          SFTP_USER: ${{ secrets.HOSTINGER_SFTP_USER }}
          SFTP_PASS: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
        run: |
          missing=""
          for name in SUPABASE_URL SUPABASE_ANON_KEY SFTP_HOST SFTP_USER SFTP_PASS; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secrets:$missing"
            echo "Add them at https://github.com/dabeerqureshi/iq-motors-website/settings/secrets/actions"
            exit 1
          fi

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SERVICE_ID_EMAILJS: ${{ secrets.EMAILJS_SERVICE_ID }}
          VITE_PUBLIC_KEY_EMAILJS: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          VITE_TEMPLATE_ID_EMAILJS: ${{ secrets.EMAILJS_TEMPLATE_ID }}
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "::error::Build did not produce dist/index.html"
            exit 1
          fi
          du -sh dist

      # Upload the contents of dist/ straight into the Hostinger web root.
      # strip_components: 1 drops the leading "dist/" so files land in
      # /public_html instead of a nested dist/ folder. dist/.htaccess is
      # listed explicitly because the glob skips dotfiles.
      - name: Deploy to Hostinger via SFTP
        uses: appleboy/sftp-action@v1.7.2
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          port: ${{ secrets.HOSTINGER_SFTP_PORT || '22' }}
          username: ${{ secrets.HOSTINGER_SFTP_USER }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          source: "dist/*,dist/.htaccess"
          target: ${{ secrets.HOSTINGER_REMOTE_BASE || '/public_html' }}
          rm: true
          strip_components: 1
          overwrite: true
          verbose: true
          retry: 3
          retry-interval: "30s"

      - name: Done
        run: echo "::notice title=Deployed::Commit ${{ github.sha }} is live at https://iq-motors.co.uk"
