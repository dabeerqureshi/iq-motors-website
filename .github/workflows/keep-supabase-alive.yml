name: Keep Supabase Project Active

on:
  schedule:
    # Runs every Monday at 06:00 UTC. Supabase free-tier projects auto-pause
    # after ~1 week of inactivity; this weekly ping keeps the project online.
    - cron: "0 6 * * 1"
  workflow_dispatch: # allows manual trigger from the GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          # A lightweight read-only query that keeps the project from pausing.
          curl -fsS --max-time 30 \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/stock_list?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -o /dev/null

      - name: Report status
        if: failure()
        run: |
          echo "::warning title=Supabase unreachable::"
          echo "The keep-alive request failed. The project may be paused,"
          echo "suspended, or the access key may have rotated. Sign in to"
          echo "Supabase and check Project Settings > General."