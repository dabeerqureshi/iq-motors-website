<!DOCTYPE html>
  <html lang="en-GB">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IQ Motors Limited | Mercedes-Benz Specialists in Ealing, London</title>
    <link rel="canonical" href="https://www.iqmotorslimited.com/" />
    <meta
      name="description"
      content="IQ Motors Ltd — Mercedes-Benz specialists in Ealing, London. Quality used cars, servicing & finance. Autotrader Award Winners. Call 07877 028198."
    />
    <meta name="theme-color" content="#1E40AF" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="IQ Motors Limited | Mercedes-Benz Specialists" />
    <meta
      property="og:description"
      content="IQ Motors Ltd — Mercedes-Benz specialists in Ealing, London. Quality used cars, servicing & finance. Autotrader Award Winners."
    />
    <meta
      property="og:image"
      content="https://www.iqmotorslimited.com/lovable-uploads/ea048769-bd2d-431c-b30b-d7aaea18d03d.png"
    />
    <meta property="og:url" content="https://www.iqmotorslimited.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Structured data (AutoDealer / Vehicle / FAQPage ...) is generated at runtime
      by src/lib/seo.ts from src/data/seo.json, which is the single source of
      truth. A second, hand-written AutoDealer block used to live here, so the
      homepage published two competing "AutoDealer" entities (different
      descriptions, no NAP match). Do not re-add it here.
    -->
    <script>
      // Blank-page guard: if the bundle fails to load or throws before React
      // mounts, show the visitor an explanation instead of an empty page.
      // Once React has rendered something this becomes a no-op.
      (function () {
        var root = document.getElementById("root");
        function fail(detail) {
          if (!root || root.childElementCount > 0) return;
          root.innerHTML =
            '<div style="font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:48px 24px;text-align:center;color:#1f2937">' +
            '<h1 style="font-size:22px;margin:0 0 12px">Sorry, the site did not load</h1>' +
            '<p style="margin:0 0 20px;color:#4b5563">Please reload the page. If it keeps happening, call us on ' +
            '<a href="tel:+447877028198" style="color:#1E40AF">07877 028198</a>.</p>' +
            '<button type="button" onclick="window.location.reload()" style="background:#1E40AF;color:#fff;border:0;border-radius:6px;padding:10px 18px;font-size:15px;cursor:pointer">Reload page</button>' +
            (detail ? '<p style="margin:20px 0 0;font-size:12px;color:#9ca3af">' + detail + "</p>" : "") +
            "</div>";
        }
        window.addEventListener("error", function (event) {
          fail(event && event.message ? event.message : "");
        });
        window.addEventListener("unhandledrejection", function (event) {
          fail(event && event.reason ? String(event.reason) : "");
        });
        // Module scripts run before `load`, so by now React should have mounted.
        window.addEventListener("load", function () {
          window.setTimeout(function () {
            fail("The application script did not start.");
          }, 4000);
        });
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
