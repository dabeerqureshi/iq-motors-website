    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutoDealer",
        "name": "IQ Motors Limited",
        "description": "Mercedes-Benz specialists in Northfields, West Ealing. Quality used Mercedes-Benz cars, expert servicing and flexible finance.",
        "url": "https://www.iqmotorslimited.com/",
        "telephone": "+447877028198",
        "email": "iqmotors0@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "28 Northfield Avenue",
          "addressLocality": "Ealing",
          "addressRegion": "London",
          "postalCode": "W13 9RL",
          "addressCountry": "GB"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "09:00",
            "closes": "20:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "09:00",
            "closes": "18:00"
          }
        ],
        "priceRange": "££"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Blank-page guard. If the bundle fails to start (for example a build that
      // shipped without its VITE_* environment variables), show something
      // readable instead of leaving #root empty forever. It only ever replaces
      // the page while #root is still empty, so a rendered app is never touched.
      (function () {
        var shown = false;

        function showFallback(detail) {
          if (shown) return;
          var root = document.getElementById("root");
          if (!root || root.childElementCount > 0) return;
          shown = true;
          console.error("[IQ Motors] The app failed to start:", detail);
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;' +
            "justify-content:center;padding:24px;text-align:center;background:#f8fafc;" +
            'color:#0f172a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif">' +
            '<div style="max-width:32rem">' +
            '<h1 style="margin:0 0 12px;font-size:1.5rem;font-weight:700">Sorry, something went wrong</h1>' +
            '<p style="margin:0 0 16px;line-height:1.6">Please refresh the page. If it keeps ' +
            'happening, call us on <a style="color:#1e40af;font-weight:600" ' +
            'href="tel:+447877028198">07877 028198</a>.</p>' +
            "</div></div>";
        }

        window.addEventListener("error", function (event) {
          showFallback(event.message || event.error);
        });
        window.addEventListener("unhandledrejection", function (event) {
          showFallback(event.reason);
        });
      })();
    </script>
  </body>
</html>
